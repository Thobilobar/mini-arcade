name: Test and deploy Mini Arcade to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  test-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Run release checks
        run: |
          node tools/tma-static-check.js
          node tools/tma-unit-test.js
          node tools/tma-game-smoke.js
          node tools/tma-multiplayer-test.js
          node tools/tma-multiplayer-game-test.js
          node tools/tma-multiplayer-stress.js
          node tools/github-pages-check.js

      - name: Prepare immutable Pages artifact
        shell: bash
        run: |
          rm -rf _site
          cp -a www _site
          printf "\nself.APP_BUILD = '%s';\n" "${GITHUB_SHA::12}" >> _site/version.js
          printf '{"commit":"%s","deployed_at":"%s"}\n' \
            "${GITHUB_SHA}" "$(date -u +%Y-%m-%dT%H:%M:%SZ)" > _site/deployment.json

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
